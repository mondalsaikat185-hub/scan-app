<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OpenCV Load Test</title></head>
<body style="font-family:sans-serif;padding:20px">
  <h3>OpenCV Load Test</h3>
  <pre id="log">starting…</pre>
  <script>
    const log = document.getElementById('log');
    const t0 = Date.now();
    const say = (m) => { log.textContent += "\n" + ((Date.now()-t0)/1000).toFixed(1) + "s — " + m; };

    // UI জমে যাচ্ছে কিনা বোঝার heartbeat: main thread ব্লক হলে এটা থেমে যাবে
    let beats = 0;
    setInterval(() => { beats++; document.title = 'beat ' + beats; }, 200);

    say('injecting opencv.js…');
    const s = document.createElement('script');
    s.src = '/opencv.js';
    s.onload = () => say('script onload fired (downloaded+parsed)');
    s.onerror = () => say('SCRIPT ERROR — download failed');
    document.body.appendChild(s);

    const poll = setInterval(() => {
      if (window.cv && window.cv.Mat) {
        clearInterval(poll);
        say('cv.Mat READY — beats=' + beats);
      }
    }, 200);
  </script>
</body>
</html>
