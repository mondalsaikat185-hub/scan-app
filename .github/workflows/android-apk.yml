name: Android APK — build, test on emulator, publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish APK even if native files did not change"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.chg.outputs.native }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did the native (APK) part change?
        id: chg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "native=${{ inputs.publish }}" >> $GITHUB_OUTPUT; exit 0; fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then echo "native=true" >> $GITHUB_OUTPUT; exit 0; fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -E '^(android/|capacitor\.config\.json|package(-lock)?\.json|\.github/workflows/)'; then
            echo "native=true" >> $GITHUB_OUTPUT
          else
            echo "native=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install & build web app
        run: |
          npm ci
          npm run build

      - name: Slim web assets for the APK
        run: |
          rm -f dist/models/uvdoc_grid.onnx
          find dist/ort -type f ! -name 'ort-wasm-simd-threaded.jsep.mjs' ! -name 'ort-wasm-simd-threaded.jsep.wasm' -delete
          du -sh dist

      - name: Capacitor sync
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/ScanApp.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: ScanApp-apk
          path: out/ScanApp.apk

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ScanApp-apk
          path: out

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install test tool
        run: npm install --no-save playwright-core@1.64.1

      - name: Wait until this commit is live on scan.sanvitools.in (the app loads it)
        run: |
          for i in $(seq 1 60); do
            S=$(curl -s "https://scan.sanvitools.in/version.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
            echo "live: $S"
            if [ "$S" = "${{ github.sha }}" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::Website did not show this commit within 15 min; testing whatever is live."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in Android emulator (API 34, Google Play)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: node tests/android-e2e.mjs out/ScanApp.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: test-out/

  publish:
    needs: [build, test]
    if: needs.build.outputs.native_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScanApp-apk
          path: out

      - name: Publish to the "apk-latest" release (fixed download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Scan App — latest Android APK
          body: |
            Latest Android build (run ${{ github.run_number }}, commit ${{ github.sha }}).
            Tested on an Android emulator before publishing.
          files: out/ScanApp.apk
          make_latest: true
